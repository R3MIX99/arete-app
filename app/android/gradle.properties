org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# La carpeta del proyecto contiene un caracter no-ASCII ("Areté"). El
# Android Gradle Plugin lo bloquea por defecto en Windows; se desactiva
# ese chequeo explícitamente en vez de renombrar la carpeta del proyecto.
# Ver: http://b.android.com/95744
android.overridePathCheck=true
